name: Build and publish DLL

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build FatWar.dll
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          vsversion: "2022"

      - name: Install Ninja
        run: choco install ninja -y --no-progress

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=cl -DCMAKE_C_COMPILER=cl

      - name: Build
        run: cmake --build build --parallel

      - name: Pack DLL
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          $dll = Get-ChildItem -Path build -Recurse -Filter *.dll |
            Where-Object { $_.Name -match 'FatWar|celerity|cs2_internal' } |
            Select-Object -First 1
          if (-not $dll) { throw "DLL not found under build/" }
          Copy-Item $dll.FullName out/FatWar.dll -Force
          Get-Item out/FatWar.dll | Format-List Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FatWar-dll
          path: out/FatWar.dll

      - name: Publish to fatwar-bin
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        shell: pwsh
        env:
          BIN_REPO_TOKEN: ${{ secrets.BIN_REPO_TOKEN }}
          BIN_REPO: san5ezez/fatwar-bin
        run: |
          if (-not $env:BIN_REPO_TOKEN) {
            Write-Host "BIN_REPO_TOKEN not set — skip publish"
            exit 0
          }

          $headers = @{
            Authorization = "Bearer $env:BIN_REPO_TOKEN"
            Accept        = "application/vnd.github+json"
            "User-Agent"  = "FatWar-CI"
          }
          $api = "https://api.github.com/repos/$env:BIN_REPO"

          $rel = $null
          try {
            $rel = Invoke-RestMethod -Headers $headers -Uri "$api/releases/tags/latest"
          } catch {
            $body = @{
              tag_name = "latest"
              name     = "Latest"
              body     = "Rolling build"
              draft    = $false
            } | ConvertTo-Json
            $rel = Invoke-RestMethod -Method Post -Headers $headers -Uri "$api/releases" -Body $body -ContentType "application/json"
          }

          $relId = $rel.id
          $uploadBase = ($rel.upload_url -split "\{")[0]

          try {
            $assets = Invoke-RestMethod -Headers $headers -Uri "$api/releases/$relId/assets"
            foreach ($a in $assets) {
              if ($a.name -eq "FatWar.dll") {
                Invoke-RestMethod -Method Delete -Headers $headers -Uri "https://api.github.com/repos/\( env:BIN_REPO/releases/assets/ \)($a.id)" -ErrorAction SilentlyContinue
              }
            }
          } catch {
            Write-Host "asset cleanup: $_"
          }

          $bytes = [System.IO.File]::ReadAllBytes("$pwd/out/FatWar.dll")
          $uploadHeaders = @{
            Authorization  = "Bearer $env:BIN_REPO_TOKEN"
            Accept         = "application/vnd.github+json"
            "Content-Type" = "application/octet-stream"
            "User-Agent"   = "FatWar-CI"
          }
          $uploadUrl = $uploadBase + "?name=FatWar.dll"
          Invoke-RestMethod -Method Post -Headers $uploadHeaders -Uri $uploadUrl -Body $bytes | Out-Null
          Write-Host "OK -> https://github.com/san5ezez/fatwar-bin/releases/latest"
